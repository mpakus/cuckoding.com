schema_version: 1
key: rtk
name: RTK shell output filter
version: 0.49.0
kind: shell_filter
homepage: https://github.com/rtk-ai/rtk
license: Apache-2.0
detect:
  binaries:
    - name: rtk
      version_command: [rtk, --version]
      min_version: 0.49.0
  paths: []
  env: []
capabilities:
  - shell_filter.wrap_command
  - shell_filter.analytics
permissions:
  host_process: true
  network: none
  read_paths: ["${RUN_WORKTREE}"]
  write_paths: []
  secrets: []
config_schema:
  mode: {type: string, enum: [auto, passthrough], default: auto}
scopes: [project, board, role, stage]
isolation_claims: []
