[package]
name = "cuckoding-shell-spike"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
getrandom = "=0.4.3"
libc = "=0.2.189"
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = ["tray-icon"] }

# macOS 27 rejects misaligned stripped proc-macro dylibs during release builds.
# Remove this once rust-lang/rust#157750 is fixed in the pinned toolchain.
[profile.release]
strip = false
