name: macOS release candidate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          otp-version: '28.5'
          elixir-version: '1.20.3'
          version-type: strict
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build isolated pinned OTP and OpenSSL runtime
        run: |
          python3 -B scripts/test_build_release_runtime.py
          python3 -B scripts/build_release_runtime.py --output "$RUNNER_TEMP/boss-release-runtime" --jobs 3
          printf '%s\n' "$RUNNER_TEMP/boss-release-runtime/otp/bin" >> "$GITHUB_PATH"
          printf 'INSTALL_DIR_FOR_OTP=%s\n' "$RUNNER_TEMP/boss-release-runtime/otp" >> "$GITHUB_ENV"
      - name: Verify effective release runtime
        run: |
          erl -noshell -eval 'io:format("OTP ~s~n~p~n", [erlang:system_info(otp_release), crypto:info_lib()]), halt().'
          elixir --version
      - name: Install locked dependencies and build assets
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix setup
      - name: Audit dependencies
        run: |
          mix hex.audit
          npm --prefix assets audit --audit-level=high
      - name: Verify source
        run: |
          mix format --check-formatted
          mix format --check-formatted rel/package.exs rel/test_package.exs
          elixir rel/test_package.exs
          python3 -c 'import ast,pathlib; ast.parse(pathlib.Path("scripts/smoke_release.py").read_text())'
          python3 -B scripts/test_sign_macos_release.py
          mix compile --warnings-as-errors
          mix test
      - name: Assemble host-specific candidate
        run: MIX_ENV=prod mix release.build
      - name: Verify unpacked candidate
        run: python3 scripts/smoke_release.py _build/prod/boss-*.tar.gz
      - name: Record checksums
        run: shasum -a 256 _build/prod/boss-*.tar.gz > _build/prod/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: boss-rc-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            _build/prod/boss-*.tar.gz
            _build/prod/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
