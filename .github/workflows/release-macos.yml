name: release-macos

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.4"
          elixir-version: "1.19.5"
          version-type: strict

      - name: Install pinned build tools
        run: |
          brew install rtk-ai/tap/rtk
          rtk rustup toolchain install 1.90.0 --profile minimal
          rtk cargo +1.90.0 install tauri-cli --version 2.11.4 --locked

      - name: Verify source quality before loading signing material
        run: |
          rtk mix deps.get
          rtk mix quality

      - name: Check release configuration
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CUCKODING_UPDATE_ENDPOINT: ${{ vars.CUCKODING_UPDATE_ENDPOINT }}
          CUCKODING_UPDATE_BASE_URL: ${{ vars.CUCKODING_UPDATE_BASE_URL }}
          CUCKODING_UPDATER_PUBLIC_KEY: ${{ vars.CUCKODING_UPDATER_PUBLIC_KEY }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_NOTARY_KEY APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER \
            TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            CUCKODING_UPDATE_ENDPOINT CUCKODING_UPDATE_BASE_URL CUCKODING_UPDATER_PUBLIC_KEY; do
            if [ -z "${!name}" ]; then
              rtk proxy printf '::error title=Missing release configuration::%s is not configured\n' "$name"
              missing=1
            fi
          done
          exit "$missing"

      - uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Prepare notarization key
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          rtk proxy /usr/bin/install -m 600 /dev/null "$RUNNER_TEMP/cuckoding-notary-key.p8"
          rtk proxy /usr/bin/printf '%s' "$APPLE_NOTARY_KEY" > "$RUNNER_TEMP/cuckoding-notary-key.p8"

      - name: Record reproducible source timestamp
        run: rtk git log -1 --format=SOURCE_DATE_EPOCH=%ct >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and verify
        env:
          CUCKODING_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CUCKODING_NOTARY_KEY_PATH: ${{ runner.temp }}/cuckoding-notary-key.p8
          CUCKODING_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          CUCKODING_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          CUCKODING_UPDATE_ENDPOINT: ${{ vars.CUCKODING_UPDATE_ENDPOINT }}
          CUCKODING_UPDATE_BASE_URL: ${{ vars.CUCKODING_UPDATE_BASE_URL }}
          CUCKODING_UPDATER_PUBLIC_KEY: ${{ vars.CUCKODING_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: rtk proxy sh desktop/release.sh

      - name: Remove notarization key
        if: always()
        run: rtk proxy /bin/rm -f "$RUNNER_TEMP/cuckoding-notary-key.p8"

      - name: Upload verified release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Cuckoding-macos-arm64
          path: desktop/dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: macos-15
    permissions:
      actions: read
      contents: write

    steps:
      - name: Install RTK
        run: brew install rtk-ai/tap/rtk

      - name: Download verified release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Cuckoding-macos-arm64
          path: desktop/dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rtk gh release create "$GITHUB_REF_NAME" \
            desktop/dist/Cuckoding-* \
            desktop/dist/latest.json \
            desktop/dist/SHA256SUMS \
            desktop/dist/evidence/*.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "Cuckoding $GITHUB_REF_NAME"
