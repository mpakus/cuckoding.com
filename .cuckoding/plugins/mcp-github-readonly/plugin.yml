schema_version: 1
key: mcp-github-readonly
name: GitHub read-only MCP server
version: 0.1.0
kind: mcp_server
detect:
  binaries:
    - name: npx
      version_command: ["npx", "--version"]
capabilities: [mcp.tools]
permissions:
  host_process: true
  network: external
  read_paths: []
  write_paths: []
  secrets: []            # read-only public access; a token would have to be declared here and approved
server:
  command: npx
  args: ["-y", "@modelcontextprotocol/server-github"]
  env: {}
  tools_allow: ["search_repositories", "get_file_contents", "list_issues"]
scopes: [project, board, stage]
